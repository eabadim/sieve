[package]
name = "sieve"
version = "0.1.0"
edition = "2021"
description = "Triage TUI for email. Himalaya I/O, strategy + agent. No compose."
license = "MIT"
repository = "https://github.com/eabadim/sieve"
readme = "README.md"
keywords = ["email", "tui", "triage"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
